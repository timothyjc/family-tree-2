        const dad = isFather(byId[ps[0]]) ? byId[ps[0]] : byId[ps[1]], mum = dad === byId[ps[0]] ? byId[ps[1]] : byId[ps[0]];
        const gap = mum.col - dad.col - 1;
        if (gap > 0.01 && !placed.some(o => o.row === r && o.col > dad.col + 0.01 && o.col < mum.col - 0.01)) {
          move(group(dad.id), gap / 2);
          move(group(mum.id), -gap / 2);
        }
        const kid = byId[k], gk = group(k);
        const d = (k === "tim" ? (dad.col + mum.col) / 2 : isFather(kid) ? mum.col : dad.col) - kid.col;
        if (Math.abs(d) > 0.01 && free(kid.row, gk.map(o => o.col + d), gk)) move(gk, d);
      }
    }
    const lo2 = Math.min(...placed.map(o => o.col));
    for (const o of placed) o.col += 1 - lo2;
    // Tim's brother and sister: a partner on the outer side. Any children on the chart go in a row under the couple (Tim, 2026-11-01).
    for (const [id, side] of [["brother", -1], ["sister", 1]]) {
      const f = FAMILIES.find(x => x.a === id);
      if (!f) continue;   // their partners and children are off the website for now: see nieces-and-nephews-held-back
      byId[f.b].col = byId[id].col + side;
      const mid = byId[id].col + side / 2;
      f.kids.forEach((k, i) => { byId[k].col = mid + i - (f.kids.length - 1) / 2; });
    }
  }

  // The father's side is on the left and the mother's side on the right. In every couple the father sits on the left,
  // so the father's line is at the top left. Tim asked for this on 2026-10-24.
  // The columns in PEOPLE, CLUSTERS and WIDE still put the mother's side on the left. arrange() turns them round:
  // it mirrors the whole chart, then, from your parents up, turns round each couple whose mother is on the left.
  // A couple turns with everything above it and everything that hangs on it: brothers and sisters, a first wife.
  const isFather = o => /father/i.test(o.who || o.rel || "");
  function arrange() {
    const items = PEOPLE.filter(q => !q.mini && shown(q)).concat(CLUSTERS.filter(shown), GAPS);
    const lo = Math.min(...items.map(o => o.col)), hi = Math.max(...items.map(o => o.col));
    for (const o of items) o.col = lo + hi - o.col;
    const { parents, hangers } = relations();
    const branch = id => byId[id] ? [byId[id]].concat(hangers[id] || [], ...(parents[id] || []).map(branch)) : [];
    const couples = Object.values(parents).filter(ps => ps.length === 2).sort((x, y) => byId[y[0]].row - byId[x[0]].row);
    for (const [a, b] of couples) {
      const dad = isFather(byId[a]) ? byId[a] : byId[b], mum = dad === byId[a] ? byId[b] : byId[a];
      if (dad.col < mum.col) continue;
      const set = [...new Set(branch(a).concat(branch(b)))];
      const l = Math.min(...set.map(o => o.col)), r = Math.max(...set.map(o => o.col));
      for (const o of set) o.col = l + r - o.col;
    }
  }

  const place = p => { const q = PLACES[p.id]; return q ? (q.to ? q.from + " → " + q.to : q.from) : p.country; };
  // The years on a card: "1817–1894 (77)". The number in brackets is the age at death, worked out from the two years.
  // "c." means about. A lone "?" means the year is not found. A year from a family tree shows no mark here; the panel marks it 🗣️.
  const life = p => {
    if (p.id === "tim") return "this is you";
    const L = LIFE[p.id];
    if (!L || p.many) return p.years;
    const tidy = t => String(t || "").replace(/\?$/, ""), b = tidy(L[0]), d = tidy(L[1]);
    if (d === "living") return b ? "born " + b : "";
    if (!b && !d) return "dates not found";
    const one = t => /^(c\.)?\d{4}$/.test(t), y = t => +t.match(/\d{4}/)[0];
    // the exact age when it is known; otherwise "c." and the difference of the years, which can be one too high
    const age = L[2] != null ? String(L[2]) : one(b) && one(d) ? "c." + (y(d) - y(b)) : "";
    return (b || "?") + "–" + (d || "?") + (age ? " (" + age + ")" : "");
  };
  const esc = s => String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  // A life story: paragraphs, and { h: "…" } where a new part of the life starts. A long story gets these headings,
  // so it does not read as one wall of text (Tim, 2026-10-25).
  const bioHtml = bio => bio.map(t => typeof t === "string" ? `<p>${esc(t)}</p>` : `<h4 class="bio-h">${esc(t.h)}</h4>`).join("");
  const initials = p => p.unknown ? "?" : (w => w.length > 1 ? w[0][0] + w[w.length - 1][0] : w[0][0])(p.short.split(" ").filter(x => /^[A-Z]/.test(x)));

  let zoom = 1;
  const APP = window.matchMedia ? window.matchMedia("(max-width: 760px)") : { matches: false, addEventListener() {} };   // a phone: the page is an app
  let mapFull = false;   // a computer: the tree fills the screen
  let appCard = false;   // on the phone, an open card has added a step to the browser's history
  const canvas = document.getElementById("canvas");
  const treeScroll = document.getElementById("treeScroll");
  const panel = document.getElementById("panel");
  const panelInner = document.getElementById("panelInner");

  // A photo is one image (photo.src) or a crop from the 256-pixel tiles of a Trove newspaper page (photo.tiles).
  // crop = { x, y, w }: the top-left corner and the width of the crop, in pixels of the joined tiles.
  // ---- photos ----
  // PHOTOS gives each photo's address. In the shared copy a photo is its own locked file ("enc:p/..."), which the
  // page opens only when it shows the photo, so the page itself stays small. A blank image holds the place until then.
  const BLANK = "data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==";
  const photoCache = {};
  const locked = key => String(PHOTOS[key] || "").startsWith("enc:");
  const photoUrl = key => !locked(key) ? Promise.resolve(PHOTOS[key])
    : photoCache[key] || (photoCache[key] = window.openPhoto(PHOTOS[key].slice(4)));
  const imgSrc = key => locked(key) ? `src="${BLANK}" data-ph="${esc(key)}"` : `src="${esc(PHOTOS[key])}"`;
  // Any image added with data-ph gets its photo: a failed photo counts as a broken image, so the page's usual fallback shows.
  const fillPhotos = () => document.querySelectorAll("img[data-ph]").forEach(img => {
    const key = img.dataset.ph;
    img.removeAttribute("data-ph");
    photoUrl(key).then(u => { img.src = u; }, () => img.dispatchEvent(new Event("error")));
  });
  new MutationObserver(fillPhotos).observe(document.body, { childList: true, subtree: true });

  function photoHtml(p, boxW, crop) {
    const ph = p.photo;
    // pos, when given, says which part of the picture sits in the middle of the round frame
    if (ph.img || ph.src) return `<img class="ph-one" ${ph.img ? imgSrc(ph.img) : `src="${esc(ph.src)}"`} alt="" loading="lazy"${ph.pos ? ` style="object-position:${esc(ph.pos)}"` : ""}>`;
    const t = ph.tiles, k = boxW / crop.w;
    let out = "";
    for (let j = 0; j < t.rows; j++) for (let i = 0; i < t.cols; i++) {
      out += `<img class="ph-tile" alt="" loading="lazy" src="https://trove.nla.gov.au/imageservice/nla.news-page${t.page}/tile3-${t.c0 + i}-${t.r0 + j}" style="left:${((i * 256 - crop.x) * k).toFixed(1)}px;top:${((j * 256 - crop.y) * k).toFixed(1)}px;width:${(256 * k).toFixed(1)}px;height:${(256 * k).toFixed(1)}px">`;
    }
    return `<span class="ph-clip">${out}</span>`;
  }

  // The star that marks a notable person. It sits before the name. Tim chose the four-point star on 2026-10-10.
  // The marks sit in a row above the name, on the tree cards and in the Notable section. The generation lists show none.
  // Tim, 2026-10-26. (Before, they followed the name in its own text.)
  // A no-break space keeps each mark on the line with the first word of the name.
  const STAR = '⭐\u00A0';
  // The turtle marks, in each generation from the grandparents back, the earliest-born ancestor. Tim chose it on 2026-10-27,
  // in place of the sports medal 🏅, which looked like a war medal beside the service marks.
  const EARLIEST = '🐢\u00A0';
  // The rabbit marks, in each generation from the grandparents back, the latest-born ancestor. Tim asked for it on 2026-10-27.
  const LATEST = '🐇\u00A0';
  // Military service (the war field). 🎖️ marks a person who saw combat; 🫡 one who served with no combat known. Tim, 2026-10-27.
  const FOUGHT = '🎖️\u00A0', SERVED = '🫡\u00A0';
  const warMark = p => !p.war ? "" : p.war.mark === "fought" ? FOUGHT : SERVED;
  // The cake marks, in each generation, the ancestor who lived the longest. Tim chose it on 2026-10-26.
  const CAKE = '🎂\u00A0';
  // ❓ beside a name marks a person who fits by strong signs, but whom no record proves yet. Tim chose the emoji on 2026-10-26.
  const LIKELY = '❓\u00A0';
  // 🗣️ marks hearsay: we checked the tree's sources, and only other people's family trees back the facts (the hearsay field).
  // 📋 marks a person taken from a family tree whose sources are not checked yet: an Ancestry link or fromTrees, without treeChecked or hearsay. Tim, 2026-10-26.
  const HEARSAY = '🗣️\u00A0';
  const TOCHECK = '📋\u00A0';
  // 📋 shows until the records cited by the person's Ancestry tree page are checked (Tim, 2026-10-26).
  const toCheck = p => !p.hearsay && !p.treeChecked && (p.fromTrees || !!ANC[p.id]);
  // 📷 beside a name marks a person whose panel holds pictures beyond the card's portrait: more photos, a grave, a document.
  // Tim chose it on 2026-10-26, after first trying 🖼️.
  const PICTURES = '📷\u00A0';
  const hasPictures = p => (p.gallery || []).length > 0 || !!(p.photo && p.photo.from);
  // A plus emoji beside a name marks a person who was adopted. Tim chose it on 2026-10-24.
  const ADOPTED = '<span class="ad" aria-label="Adopted" title="Adopted">➕︎</span> ';

  // The label under a couple. "3 known" means three children are found and there may be more:
  // the pill then says "3 children?", the "?" as plain text. Tim asked for this on 2026-10-24.
  const countLabel = t => {
    const m = String(t).match(/^(\d+) known$/);
    return m ? `<span title="There may be more">${m[1]} ${m[1] === "1" ? "child" : "children"}?</span>` : esc(t);
  };

  // ---- chart ----
  // Solid lines join Tim's direct ancestors. Dashed lines lead to everyone else, and to the empty boxes.
  const onLine = id => LINE.has(id);
  // Medals, one generation at a time, from Tim's grandparents back (rows 3 up to the earliest row): the direct ancestor who
  // lived the longest, the one born the earliest, and the one born the latest. A medal needs at least two people in the generation
  // with that figure; a tie gives it to each. No rabbit when all were born in the same year: the turtle already says it. The medal shows on the tree and in the card, with a line that says why.
  // Not in the Notable list: it is not something they did (Tim, 2026-10-26).
  const RECORDS = (() => {
    const year = t => { const m = String(t || "").match(/\d{4}/); return m && !/before|after/.test(t) ? +m[0] : null; };
    const approx = t => /c\.|\?/.test(String(t || ""));
    const genName = r => r === 3 ? "grandparents" : r === 2 ? "great-grandparents" : r === 1 ? "great-great-grandparents"
      : r === 0 ? "great-great-great-grandparents" : `${3 - r}th great-grandparents`;
    const r = [];
    for (const row of [...new Set(PEOPLE.map(q => q.row))].filter(x => x <= 3).sort((x, y) => y - x)) {
      const dated = PEOPLE.filter(q => !q.mini && q.row === row && LINE.has(q.id) && LIFE[q.id])
        .map(q => ({ q, b: year(LIFE[q.id][0]), d: year(LIFE[q.id][1]), a: LIFE[q.id][2] }));
      for (const x of dated) x.age = x.a != null ? x.a : x.b && x.d ? x.d - x.b : null;
      const aged = dated.filter(x => x.age != null), born = dated.filter(x => x.b);
      if (aged.length > 1) {
        const top = Math.max(...aged.map(x => x.age));
        for (const x of aged.filter(x => x.age === top))
          r.push({ id: x.q.id, mark: CAKE, text: `Lived to ${x.a != null ? "" : "about "}${top}, the longest of your ${genName(row)}.` });
      }
      if (born.length > 1) {
        const low = Math.min(...born.map(x => x.b));
        for (const x of born.filter(x => x.b === low))
          r.push({ id: x.q.id, mark: EARLIEST, text: `Born ${approx(LIFE[x.q.id][0]) ? "c." : "in "}${low}, the earliest of your ${genName(row)}.` });
        const high = Math.max(...born.map(x => x.b));
        if (high > low) for (const x of born.filter(x => x.b === high))
          r.push({ id: x.q.id, mark: LATEST, text: `Born ${approx(LIFE[x.q.id][0]) ? "c." : "in "}${high}, the latest of your ${genName(row)}.` });
      }
    }
    return r;
  })();
  const recordOf = id => RECORDS.filter(r => r.id === id);
  // Every mark is plain text inside the name, so the name's highlight covers it, and it comes after the name, joined to
  // the last word by a no-break space (Tim, 2026-10-26). The constants end in a space for the explaining lines in the card.
  const markList = p => [...recordOf(p.id).map(r => r.mark), p.notable ? STAR : "", warMark(p), p.likely ? LIKELY : "", p.hearsay ? HEARSAY : toCheck(p) ? TOCHECK : "", hasPictures(p) ? PICTURES : ""]
    .filter(Boolean).map(m => m.replace(/\u00A0$/, ""));
  const markRow = p => `<span class="mks">${markList(p).join("\u2009")}</span>`;   // above a name; empty on a card without marks, so the names line up

  function drawChart() {
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    let d = "", dx = "", dg = "", pills = "";
    const links = GAP_LINKS;
    const fams = FAMILIES.filter(famShown).filter(f => !(!f.b && links.some(l => l[0] === f.a))).map(f => ({ f, gap: false }))
      .concat(links.map(l => ({ f: { a: l[0], b: l[1], kids: [l[2]] }, gap: true })));
    for (const { f, gap } of fams) {
      const a = byId[f.a], b = f.b ? byId[f.b] : null;   // b is missing when only one parent is known
      const left = b && b.col < a.col ? b : a, right = left === a ? b : a;   // either partner may be on the left
      const yMid = b ? Y(a.row) + CARD_H / 2 : Y(a.row) + CARD_H;
      const x1 = X(left.col) + CARD_W, x2 = b ? X(right.col) : x1, mx = b ? (x1 + x2) / 2 : CX(a.col);
      const busY = Y(a.row) + CARD_H + BUS_AT;
      if (gap) {   // a couple with an empty box. A known parent keeps a solid line to the child.
        const k = byId[f.kids[0]], kx = CX(k.col), down = `M${mx} ${yMid}V${busY}H${kx}V${Y(k.row)}`;
        if (a.who) dg += `M${x1} ${yMid}H${x2}` + down;
        else if (left === a) { d += `M${x1} ${yMid}H${mx}` + down; dg += `M${mx} ${yMid}H${x2}`; }
        else { d += `M${mx} ${yMid}H${x2}` + down; dg += `M${x1} ${yMid}H${mx}`; }
        continue;
      }
      const couple = onLine(f.a) && (!b || onLine(f.b));
      const main = couple ? f.kids.filter(onLine) : [], side = f.kids.filter(k => !main.includes(k));
      const pair = b ? `M${x1} ${yMid}H${x2}` : "", drop = `M${mx} ${yMid}V${busY}`;
      if (couple) d += pair; else dx += pair;
      if (!f.kids.length) continue;   // a couple with no children on the chart: no drop line and no count
      if (main.length) d += drop; else dx += drop;
      const xs = main.map(k => CX(byId[k].col)).concat(mx);
      const lo = Math.min(...xs), hi = Math.max(...xs);
      d += `M${lo} ${busY}H${hi}`;
      for (const k of main) d += `M${CX(byId[k].col)} ${busY}V${Y(byId[k].row)}`;
      const reach = cx => cx < lo ? `H${lo}` : cx > hi ? `H${hi}` : "";
      for (const k of side) { const cx = CX(byId[k].col); dx += `M${cx} ${Y(byId[k].row)}V${busY}${reach(cx)}`; }
      for (const cid of f.clusters || []) { const c = clById[cid], cx = CX(c.col); dx += `M${cx} ${Y(c.row)}V${busY}${reach(cx)}`; }
      pills += `<span class="kids-pill${main.length ? "" : " side"}" style="left:${mx}px;top:${Y(a.row) + CARD_H + PILL_AT}px">${countLabel(f.count)}</span>`;
    }
    for (const c of CLUSTERS) if (c.anchor) {
      const ax = CX(byId[c.anchor].col), cx = CX(c.col), y = Y(c.row) - 14;
      dx += `M${cx} ${Y(c.row)}V${y}H${ax}V${Y(c.row)}`;
    }
    let html = `<svg class="links" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${d}"/><path class="extra" d="${dx}"/><path class="gapline" d="${dg}"/></svg>` + pills;
    // The two labels sit above the chart. Each one spans the columns of its side.
    const upper = PEOPLE.filter(q => q.row <= 3 && shown(q)).concat(GAPS);
    const region = (side, label) => {
      const cols = upper.filter(q => q.side === side).map(q => q.col), l = Math.min(...cols), r = Math.max(...cols);
      return `<div class="region ${side}" style="left:${X(l)}px;top:${PAD}px;width:${X(r) + CARD_W - X(l)}px"><b>${label}</b></div>`;
    };
    html += region("p", "Father's side") + region("m", "Mother's side");
    for (const p of PEOPLE.filter(q => !q.mini && shown(q))) {
      const cls = ["card", "side-" + p.side, p.id === "tim" ? "you" : "", p.unknown ? "unknown" : "", p.early ? "early" : "", LINE.has(p.id) ? "" : "aside"].join(" ").replace(/\s+/g, " ").trim();
      const av = p.photo
        ? `<span class="avatar has-photo" data-fallback="${esc(initials(p))}">${photoHtml(p, 54, p.photo.avatar ? { x: p.photo.avatar.x, y: p.photo.avatar.y, w: p.photo.avatar.d } : null)}</span>`
        : `<span class="avatar">${esc(initials(p))}</span>`;
      html += `<button type="button" class="${cls}" data-id="${p.id}" style="left:${X(p.col)}px;top:${Y(p.row)}px;width:${CARD_W}px;height:${CARD_H}px">
        <span class="card-top">${av}</span>
        ${markRow(p)}
        <span class="nm"><span class="nmt">${p.adopted ? ADOPTED : ""}${esc(p.short)}</span></span>
        ${p.nee ? `<span class="nee"><i>née</i>${esc(p.nee)}</span>` : ""}
        ${p.nick ? `<span class="nee"><i>called</i>${esc(p.nick)}</span>` : ""}
        <span class="yrs">${esc(life(p))}</span>
        <span class="plc">${esc(place(p))}</span>
        <span class="rel">${esc(p.rel)}</span>
      </button>`;
    }
    // An empty box for each ancestor not found, always shown (Tim, 2026-10-26). Like every card, it shows what the person is to Tim.
    const GRAND = ["Great-great-great-grand", "Great-great-grand", "Great-grand", "Grand"];
    for (const g of GAPS) {
      html += `<div class="card gapbox side-${g.side}" title="${esc(g.who)} of ${esc(g.of)}" style="left:${X(g.col)}px;top:${Y(g.row)}px;width:${CARD_W}px;height:${CARD_H}px">
        <span class="card-top"><span class="avatar">?</span></span>
        <span class="nm">Not found</span>
        <span class="rel">${g.rel || GRAND[g.row] + (/father/i.test(g.who) ? "father" : "mother")}</span>
      </div>`;
    }
    // A name in a box is the first name and the initials of the others, "John FC", in every box, even when the full name fits
    // (Tim, 2026-10-27). Its card gives the full name.
    // A note in brackets is left out, except a number, as in "John P. (2nd)".
    const isYoung = q => q.young || q.many;
    const boxName = s => { const [f, ...r] = s.replace(/\s*\(([^)]*)\)/g, (m, x) => /^\d/.test(x) ? " " + x : "").split(/\s+/);
      return [f, r.filter(w => !/^\d/.test(w)).map(w => w[0].toUpperCase()).join(""), ...r.filter(w => /^\d/.test(w))].filter(Boolean).join(" "); };
    for (const c of CLUSTERS.filter(shown)) {
      // The box is "All children": it also lists the ancestor, with 🧬 after the name (Tim, 2026-11-12).
      // One list in birth order. A child who died young sits in their place, in grey (Tim, 2026-11-12). Unknown years go last.
      // A child with no name has a "many" line, such as "2 unnamed".
      const fam = FAMILIES.find(f => (f.clusters || []).includes(c.id));
      const anc = fam && (fam.kids || []).find(k => LINE.has(k) && byId[k] && !c.members.includes(k));
      const all = c.members.concat(anc ? [anc] : []).sort((a, b) => bornIn(byId[a]) - bornIn(byId[b]));
      const nameList = ks => `<span class="names" style="grid-template-rows:repeat(${ks.length},auto)">${ks.map(k => byId[k].many ? `<span class="many bn" data-id="${k}">${esc(byId[k].short)}</span>` : `<span class="bn${k === anc ? " anc" : ""}${isYoung(byId[k]) ? " dy" : ""}" data-id="${k}"${isYoung(byId[k]) ? ` title="Died young"` : ""}>${byId[k].adopted ? ADOPTED : ""}${esc(byId[k].mini ? boxName(byId[k].short) : byId[k].short.split(" ")[0])}${k === anc ? " 🧬" : ""}</span>`).join("")}</span>`;
      html += `<button type="button" class="cluster side-${byId[c.members[0]].side}" data-cluster="${c.id}" data-id="${c.id}" style="left:${X(c.col)}px;top:${Y(c.row)}px;width:${CARD_W}px;height:${CARD_H}px">
        <span class="ttl"><span>All children</span></span>
        ${nameList(all)}
        <span class="rel">${esc(c.rel || "")}</span>
      </button>`;
    }
    canvas.innerHTML = html;
    canvas.querySelectorAll(".avatar.has-photo img").forEach(img => {
      img.addEventListener("error", () => { const a = img.closest(".avatar"); if (a) { a.classList.remove("has-photo"); a.textContent = a.dataset.fallback; } });
    });
  }
  // "Missing ancestors" on: the wide layout with empty boxes. Off: the compact layout. It starts off. The choice is saved on the device.
  // The saved name ends in 2, so a choice saved before the change of default on 2026-10-10 is not used.
  const keepEarly = early;
  early = false;
  setLayout();
  early = keepEarly;
  setLayout();
  drawChart();

  // ---- notable ----
  // The people who did something notable. The medals for long lives and early births are not here (Tim, 2026-10-26).
  const yr = t => { const m = String(t || "").match(/\d{4}/); return m ? +m[0] : null; };
  const noteCard = (p, text) => {
    const av = p.photo && (p.photo.img || p.photo.src)
      ? `<span class="avatar has-photo" data-fallback="${esc(initials(p))}">${photoHtml(p, 80, null)}</span>`
      : `<span class="avatar">${esc(initials(p))}</span>`;
    return `<button type="button" class="notable-chip side-${p.side}" data-id="${p.id}"><span class="nc">
      <span class="nc-head">${av}<span class="nc-id">${markList(p).length ? markRow(p) : ""}<span class="nc-name">${esc(p.short)}</span><span class="nc-yrs">${p.nick ? `called ${esc(p.nick)} · ` : ""}${esc(life(p))}</span><span class="nc-rel">${esc(p.rel)}</span></span></span>
      <span class="nc-what">${esc(text)}</span>
    </span></button>`;
  };
  document.getElementById("notables").innerHTML = PEOPLE.filter(p => p.notable)
    .sort((a, b) => NOTABLE_ORDER.indexOf(a.id) - NOTABLE_ORDER.indexOf(b.id))
    .map(p => noteCard(p, p.deed || p.notable)).join("");
  document.querySelectorAll("#notables .avatar.has-photo img").forEach(img => {
    img.addEventListener("error", () => { const a = img.closest(".avatar"); if (a) { a.classList.remove("has-photo"); a.textContent = a.dataset.fallback; } });
  });

  // ---- the photo strip under the title ----
  // One instant photo for each person with a portrait. A photo opens that person, as a card does.
  // The set repeats to fill each half of the track, and the track holds two halves. The drift moves it left by one half and starts again,
  // so the loop has no seam.
  // Each photo is drawn on a small canvas. It comes in as a grainy grey-blue print. Once the whole of it is on the screen it develops
  // over DEVELOP seconds, evenly over the whole picture, as a real instant print does, and the grain settles. At the same time the name writes itself from left to right.
  // A hover develops it four times as fast. A photo stays developed as it leaves, and goes back to a blank print only once it has gone off the left edge. Scrolling the page away and back redraws nothing.
  {
    const track = document.getElementById("snapsTrack");
    const DEVELOP = 2.2, GRAIN = 0.07, N = 128;   // seconds; grain strength; canvas pixels
    const EMULSION = [155, 166, 173];   // the grey-blue of a blank print
    // CROP: how each photo fits its square. "contain" shows the whole photo, with black bars where its shape is not square;
    // "cover" fills the square. The zoom trims just enough to hide a photo's own white margin or label, and no more.
    // A photo not listed here uses PLAIN. Every card portrait goes in the strip (2026-10-26: the new ones stayed blank before).
    const CROP = { carlPortrait: [1, 0.5, 0.35, "cover"], johanne: [1.05, 0.5, 0.5, "contain"], alexander: [1, 0.5, 0.3, "cover"], keith: [1, 0.5, 0.3, "cover"], billYoung: [1, 0.5, 0.4, "cover"],
      mum: [1, 0.5, 0.5, "cover"], dad: [1, 0.5, 0.5, "cover"], brother: [1, 0.5, 0.5, "cover"], sister: [1, 0.5, 0.5, "cover"], tim: [1, 0.5, 0.5, "cover"] };
    const SNAPS = PEOPLE.filter(p => p.photo && p.photo.img).map(p => ({ id: p.id, side: p.side, name: p.short, img: p.photo.img }));
    const TILT = [-1.2, 1, -0.9, 1.3, -1.1, 0.8, -1.3, 1.1];   // a slight tilt in degrees, anticlockwise then clockwise in turn; all at the same height
    if (!SNAPS.length) track.closest(".snaps").hidden = true;   // This copy: no photos yet
    const half = Array.from({ length: Math.max(2, Math.ceil(16 / Math.max(1, SNAPS.length))) }, () => SNAPS).flat();   // about 16 photos: wider than the widest screen
    track.innerHTML = half.concat(half).map((p, k) => {
      const copy = k >= half.length, n = k % half.length;
      return `<button type="button" class="snap side-${p.side}" data-id="${p.id}" data-img="${p.img}"${copy ? ' aria-hidden="true" tabindex="-1"' : ""} style="--r:${TILT[n % TILT.length]}deg"><span class="snap-pic"><canvas width="${N}" height="${N}"></canvas></span><span class="snap-name">${esc(p.name)}</span></button>`;
    }).join("");

    // Each photo, cropped into its square once, in grey, on its own canvas. Black bars fill the rest.
    // The page never reads a photo's pixels: a browser forbids that for a page opened from a file. Instead each frame draws
    // the photo, then lays a blank print over it, with the grain, that is more see-through where the print has developed.
    const SRC = {};
    const veil = document.createElement("canvas"); veil.width = veil.height = N;
    const veilCtx = veil.getContext("2d"), veilPx = veilCtx.createImageData(N, N);
    const smooth = v => v <= 0 ? 0 : v >= 1 ? 1 : v * v * (3 - 2 * v);
    const draw = card => {
      const g = card.ctx, src = SRC[card.img], p = card.p, d = veilPx.data;
      const k = src ? smooth(p) : 0;   // 0 = blank, 1 = developed, the same everywhere; until the photo has loaded, the print stays blank
      for (let i = 0; i < N * N; i++) {
        const noise = (Math.random() - 0.5) * 255 * GRAIN * (1 - k);
        d[i * 4] = EMULSION[0] + noise; d[i * 4 + 1] = EMULSION[1] + noise; d[i * 4 + 2] = EMULSION[2] + noise;
        d[i * 4 + 3] = 255 * (1 - k);
      }
      veilCtx.putImageData(veilPx, 0, 0);
      g.clearRect(0, 0, N, N);
      if (src) g.drawImage(src, 0, 0);
      g.drawImage(veil, 0, 0);
    };
    const cards = [...track.querySelectorAll(".snap")].map(el => ({ el, img: el.dataset.img, ctx: el.querySelector("canvas").getContext("2d"), p: 0, on: false, fast: false }));
    const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const PLAIN = [1, 0.5, 0.4, "cover"];
    [...new Set(SNAPS.map(q => q.img))].forEach(key => {
      const im = new Image();
      im.onload = () => {
        const [zoom, ax, ay, fit] = CROP[key] || PLAIN;
        const c = document.createElement("canvas"); c.width = c.height = N;
        const g = c.getContext("2d");
        g.fillStyle = "#000"; g.fillRect(0, 0, N, N);
        const k = (fit === "cover" ? Math.max(N / im.width, N / im.height) : Math.min(N / im.width, N / im.height)) * zoom;
        const w = im.width * k, h = im.height * k;
        // the anchor point of the photo sits at the same point of the square, as object-position does
        g.filter = "grayscale(1)";
        g.drawImage(im, (N - w) * ax, (N - h) * ay, w, h);
        SRC[key] = c;
        cards.filter(c => c.img === key).forEach(c => { if (still) { c.p = 1; c.el.classList.add("writ"); } draw(c); });
      };
      photoUrl(key).then(u => { im.src = u; }, () => {});
    });
    cards.forEach(draw);

    // The frame loop runs only while a photo is developing, or a blank one is in view (its grain moves).
    let running = false, then = 0;
    const tick = now => {
      const dt = Math.min(0.05, (now - then) / 1000); then = now;
      let busy = false;
      for (const c of cards) {
        if (!c.on || c.p >= 1) continue;
        c.p = Math.min(1, c.p + dt / DEVELOP * (c.fast ? 4 : 1));
        c.el.classList.add("writ");   // the name writes itself while the photo develops
        draw(c);
        busy = true;
      }
      running = busy;
      if (busy) requestAnimationFrame(tick);
    };
    const wake = () => { if (!running && !still) { running = true; then = performance.now(); requestAnimationFrame(tick); } };
    if (window.IntersectionObserver && !still) {
      const byEl = new Map(cards.map(c => [c.el, c]));
      const seen = new IntersectionObserver(list => list.forEach(x => {
        const c = byEl.get(x.target);
        const r = x.boundingClientRect, blank = () => { c.on = false; c.fast = false; c.p = 0; c.el.classList.remove("writ"); draw(c); };
        if (x.intersectionRatio >= 0.99) { c.on = true; wake(); }   // the whole photo is on the screen: it develops
        else if (!x.isIntersecting && r.right <= 0) blank();   // gone off the left edge: a blank print again, ready for its next pass
        else if (x.isIntersecting && r.right > window.innerWidth) blank();   // sliding in at the right edge: blank until the whole of it is in
        // a photo that leaves because the page scrolls up or down keeps its state, so coming back redraws nothing
      }), { threshold: [0, 0.99] });
      cards.forEach(c => seen.observe(c.el));
    } else cards.forEach(c => { c.p = 1; c.el.classList.add("writ"); draw(c); });
    cards.forEach(c => c.el.addEventListener("pointerenter", () => { c.on = true; c.fast = true; wake(); }));
    // The drift. The page moves the track, so a hand can move it too: press and hold to stop it, drag to move it,
    // let go while moving to fling it. A fling eases back to the usual drift of PASS seconds a photo. Tim, 2026-10-26.
    {
      const PASS = 4, EASE = 0.28, TOP = 1600;   // seconds a photo; seconds for a fling to die away (Tim: quick to slow); fastest fling, px a second
      let x = 0, v = 0, W = 0, held = false, grabbed = false, lastX = 0, lastT = 0, dist = 0, live = false, prev = 0, inView = true;
      const measure = () => { W = track.scrollWidth / 2; };
      const v0 = () => (still || !W) ? 0 : -W / (half.length * PASS);   // pixels a second, to the left
      const step = now => {
        const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
        if (!held) { v += (v0() - v) * (1 - Math.exp(-dt / EASE)); x += v * dt; }
        if (W) { while (x <= -W) x += W; while (x > 0) x -= W; }   // the track holds two halves, so the loop has no seam
        track.style.transform = `translateX(${x.toFixed(1)}px)`;
        if (inView || held) requestAnimationFrame(step); else live = false;
      };
      const go = () => { if (!live) { live = true; prev = performance.now(); requestAnimationFrame(step); } };
      measure(); v = v0(); window.addEventListener("resize", measure);
      if (window.IntersectionObserver) new IntersectionObserver(([e]) => { inView = e.isIntersecting; if (inView) go(); }).observe(track.parentElement);
      track.addEventListener("pointerdown", e => {
        if (e.button !== 0) return;
        held = true; grabbed = false; dist = 0; v = 0; lastX = e.clientX; lastT = e.timeStamp;
        track.classList.add("held"); go();
      });
      track.addEventListener("pointermove", e => {
        if (!held) return;
        const dx = e.clientX - lastX, dt = Math.max(1, e.timeStamp - lastT) / 1000;
        x += dx; dist += Math.abs(dx);
        v = 0.7 * (dx / dt) + 0.3 * v;   // the speed of the hand, smoothed
        lastX = e.clientX; lastT = e.timeStamp;
        if (!grabbed && dist > 4) { grabbed = true; track.setPointerCapture(e.pointerId); }   // a drag, not a click
      });
      const release = e => {
        if (!held) return;
        held = false; track.classList.remove("held");
        v = e.timeStamp - lastT > 80 ? 0 : Math.max(-TOP, Math.min(TOP, v));   // held still before letting go: no fling
      };
      track.addEventListener("pointerup", release);
      track.addEventListener("pointercancel", release);
      track.addEventListener("click", e => { if (dist > 6) { e.preventDefault(); e.stopPropagation(); } dist = 0; }, true);   // a drag does not open a photo
      go();
    }
  }

  // ---- smooth scrolling ----
  // Lenis glides the whole page toward where the wheel sends it, as on realfood.gov. A touch screen keeps its own scroll.
  // The reading panel scrolls by itself (data-lenis-prevent). A pinch on the chart zooms it; Lenis leaves a pinch alone.
  // The wheel is never blocked or ignored. A pinned section (the tree's zoom, the Notable row) settles gently instead:
  // when the page comes to rest within SETTLE of either end of one, it glides on to that end, as ScrollTrigger's snap does.
  const stops = [];   // functions that return [start, end] page positions of a pinned section
  let smooth = null;   // Lenis, once it runs: the section menu glides the page with it
  if (window.Lenis && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const SETTLE = 0.15, REST = 180;   // share of the section near each end; ms without scrolling that counts as rest
    const lenis = smooth = new Lenis({ lerp: 0.1, virtualScroll: ({ event }) => !(event.metaKey && event.target.closest && event.target.closest("#treeScroll")) });   // ⌘ with the wheel over the chart zooms it
    let timer = 0, settling = false;
    lenis.on("scroll", () => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        if (settling) { settling = false; return; }
        const y = window.scrollY;
        for (const f of stops) {
          const [a, b] = f();
          if (!(b > a) || y <= a + 1 || y >= b - 1) continue;
          const d = (y - a) / (b - a);
          const to = d < SETTLE ? a : d > 1 - SETTLE ? b : null;
          if (to !== null) { settling = true; lenis.scrollTo(to, { duration: 0.8 }); }
          return;
        }
      }, REST);
    });
    const raf = t => { lenis.raf(t); requestAnimationFrame(raf); };
    requestAnimationFrame(raf);
  }

  // A pinned row scrolls sideways: Notable. While its section is pinned, every SLOW px
  // scrolled down moves the row one pixel left. The slide ends when the last card's right edge meets the page's right margin.
  document.querySelectorAll(".notable-pin").forEach(pinSec => {
    const pin = pinSec.querySelector(".pin");
    const rail = pinSec.querySelector(".notable-rail"), row = rail.firstElementChild;
    const SLOW = 1.5;
    let slide = 0;
    const measure = () => {
      const pad = parseFloat(getComputedStyle(rail).paddingLeft) || 0;
      slide = Math.max(0, row.scrollWidth - (rail.clientWidth - 2 * pad));
      pinSec.style.height = pin.offsetHeight + slide * SLOW + "px";
      move();
    };
    stops.push(() => { const top = Math.round(pinSec.getBoundingClientRect().top + window.scrollY); return slide ? [top, top + Math.round(slide * SLOW)] : []; });
    const move = () => {
      const x = Math.min(slide, Math.max(0, -pinSec.getBoundingClientRect().top / SLOW));
      row.style.transform = `translateX(${-x}px)`;
    };
    window.addEventListener("scroll", move, { passive: true });
    window.addEventListener("resize", measure);
    if (window.ResizeObserver) { const ro = new ResizeObserver(measure); [rail, row, pin].forEach(el => ro.observe(el)); }   // a card or the pin can change size after this, as fonts and photos load
    measure();
  });

  // ---- how long each generation lived ----
  // Worked out from LIFE for the direct ancestors, so the table stays current when a date changes.
  const yearOf = t => { const m = String(t || "").match(/\d{4}/); return m ? +m[0] : null; };
  const AGE_ROWS = [[3, "Grandparents", 4], [2, "Great-grandparents", 8], [1, "Great-great-grandparents", 16], [0, "Great-great-great-grandparents", 32]];
  // The usual age: what a person of 25 could expect to reach, in the year when the ancestor was 25.
  const usualAt = (rows, y) => {
    if (y <= rows[0][0]) return rows[0][1];
    for (let i = 1; i < rows.length; i++) if (y <= rows[i][0]) { const [y0, v0] = rows[i - 1], [y1, v1] = rows[i]; return v0 + (v1 - v0) * (y - y0) / (y1 - y0); }
    return rows[rows.length - 1][1];
  };
  const mean = a => a.reduce((x, y) => x + y, 0) / a.length;
  // Your dad's side and your mum's side, under the table: a scorecard, one row per generation (Tim asked on 2026-10-25).
  // Each row compares the two sides within one generation, so both lived in the same era; the longer-lived side is marked.
  // Averaging over all generations mixed eras, as people lived longer in later ones.
  function sidesHtml() {
    const ages = (r, side) => PEOPLE.filter(q => !q.mini && q.row === r && LINE.has(q.id) && q.side === side && LIFE[q.id])
      .map(q => { const b = yearOf(LIFE[q.id][0]), d = yearOf(LIFE[q.id][1]); return b && d ? (LIFE[q.id][2] != null ? LIFE[q.id][2] : d - b) : null; }).filter(a => a !== null);
    const rows = AGE_ROWS.map(([r, label]) => {
      const p = ages(r, "p"), m = ages(r, "m");
      return p.length && m.length ? { label, p: Math.round(mean(p)), pn: p.length, m: Math.round(mean(m)), mn: m.length } : null;
    }).filter(Boolean);
    if (!rows.length) return "";
    const cell = (avg, n, won) => `<span class="sc-cell"><span class="sc-avg${won ? " won" : ""}">${avg}</span><span class="sc-n">${n} ${n === 1 ? "age" : "ages"}</span></span>`;
    const pw = rows.filter(x => x.p > x.m).length, mw = rows.filter(x => x.m > x.p).length;
    const few = rows.some(x => x.pn < 3 || x.mn < 3);
    const sum = (pw === mw ? `Each side lived longer in ${pw} of the ${rows.length} generations.`
      : `${pw > mw ? "Your dad's" : "Your mum's"} side lived longer in ${Math.max(pw, mw)} of the ${rows.length} generations.`) +
      (few ? " Some rows rest on one or two people, so they prove little." : "");
    return `<div class="ages ages-sides"><h3 class="sub-title">Your dad's side and your mum's side</h3>` +
      `<div class="scorecard"><span class="sc-h"></span><span class="sc-h side-p"><span class="gk">Dad's side</span></span><span class="sc-h side-m"><span class="gk">Mum's side</span></span>` +
      rows.map(x => `<span class="sc-gen">${x.label}</span>${cell(x.p, x.pn, x.p > x.m)}${cell(x.m, x.mn, x.m > x.p)}`).join("") +
      `</div><p class="ages-sum">${sum} The marked number is the longer-lived side in that generation.</p></div>`;
  }
  document.getElementById("ages").innerHTML = `<table class="ages"><thead><tr><th>Generation</th><th>Average age</th><th>Usual then</th><th>Youngest to oldest</th><th>Known ages</th></tr></thead><tbody>` +
    AGE_ROWS.map(([r, label, total]) => {
      const known = PEOPLE.filter(q => !q.mini && q.row === r && LINE.has(q.id) && LIFE[q.id])
        .map(q => { const b = yearOf(LIFE[q.id][0]), d = yearOf(LIFE[q.id][1]); if (!b || !d) return null;
          const y = b + 25, aus = /Australia/.test(q.country) && y >= 1921;
          return { age: LIFE[q.id][2] != null ? LIFE[q.id][2] : d - b, usual: usualAt(aus ? USUAL_AGE.australia : USUAL_AGE.england, y) }; }).filter(Boolean);
      if (!known.length) return "";
      const ages = known.map(k => k.age), avg = mean(ages), usual = mean(known.map(k => k.usual)), diff = Math.round(avg - usual);
      const tag = diff > 0 ? `<span class="up">+${diff}</span>` : diff < 0 ? `<span class="up down">−${-diff}</span>` : "";
      return `<tr><th>${label}</th><td class="avg">${Math.round(avg)}${tag}</td><td>${Math.round(usual)}</td><td>${Math.min(...ages)} to ${Math.max(...ages)}</td><td>${ages.length} of ${total}</td></tr>`;
    }).join("") + "</tbody></table>";
  document.getElementById("agesSides").innerHTML = sidesHtml();

  // ---- the holes ----
  // First the questions for the two aunts, most useful first, then the holes by family line (Tim, 2026-11-10).
  document.getElementById("askList").innerHTML = QUESTIONS.map(q =>
    `<div class="ask-group"><h3 class="sub-title">Questions for ${esc(q.who)}</h3><p class="ask-note">${esc(q.note)}</p><ol class="todo">${q.items.map(i => `<li>${esc(i[1])}</li>`).join("")}</ol></div>`).join("");
  document.getElementById("holeList").innerHTML = HOLES.map(h =>
    `<div class="q-group"><h4>${esc(h[0])}</h4><ul class="todo">${h[1].map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>`).join("");

  // ---- data sources ----
  // Each source used, with how many links on the page go to it (counted from SRC and the ANC pages, by web address).
  // Only sources with at least one link are shown; sources with no links and those not searched yet stay off the page (Tim, 2026-11-04).
  {
    const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return ""; } };
    const claimed = new Set(SOURCES.used.flatMap(x => x.hosts || []));
    const URLS = Object.values(SRC).map(([, u]) => u)
      .concat(Object.values(ANC).flatMap(v => v.split(" ").filter(Boolean).map(e => `https://www.ancestry.com/family-tree/person/tree/${e.replace("/", "/person/")}/facts`)));   // each person's own Ancestry pages count too
    const links = x => URLS.filter(u => x.other ? !claimed.has(hostOf(u)) : (x.hosts || []).includes(hostOf(u))).length;
    // traffic lights: free green, part free orange, paid red; family sources and link counts stay grey
    const kind = c => /^free$/i.test(c) ? " free" : /^paid$/i.test(c) ? " paid" : /free/i.test(c) ? " part" : "";
    const cost = c => `<span class="cost${kind(c)}">${esc(c)}</span>`;
    const count = n => n ? `<span class="cost">${n} link${n === 1 ? "" : "s"}</span>` : "";
    const name = x => x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name)}</a>` : esc(x.name);
    // family sources first, then the most links first; a tie keeps the order in SOURCES (Tim, 2026-10-25)
    const fam = x => x.cost === "Family";
    document.getElementById("srcUsed").innerHTML = SOURCES.used.map(x => ({ x, n: links(x) })).filter(({ n }) => n > 0)
      .sort((a, b) => fam(b.x) - fam(a.x) || b.n - a.n)
      .map(({ x, n }) => `<li><b>${name(x)}${cost(x.cost)}${count(n)}</b><span>${esc(x.what)}</span></li>`).join("");
  }

  // ---- moves between countries ----
  // A place's flag follows its name, joined by a no-break space so it never starts a line (FLAGS).
  const flagAfter = text => { const f = FLAGS.find(([w]) => text.includes(w)); return f ? "\u00A0" + f[1] : ""; };
  document.getElementById("moves").innerHTML = MOVES.map(m =>
    `<li><b>${m.unverified ? "🗣️\u00A0" : ""}${esc(m.when)} · ${esc(m.from)}${flagAfter(m.from)} → ${esc(m.to)}${flagAfter(m.to)}</b><span>${esc(m.text)}</span></li>`).join("");

  // ---- your ancestry by country ----
  // Each parent gives half, each grandparent a quarter, and so on back. Each line counts where its oldest known ancestor was born
  // (ORIGINS). With one parent known, that parent takes half, and the other half counts the person's own birthplace.
  // The page works it out from FAMILIES, PLACES and PEOPLE, so it needs no separate update. Tim asked for this on 2026-10-27.
  {
    const parentsOf = id => { const f = FAMILIES.find(f => (f.kids || []).includes(id)); return f ? [f.a, f.b].filter(Boolean) : []; };
    const placeOf = id => (PLACES[id] && PLACES[id].from) || (byId[id] && byId[id].country) || "";
    const ROOT_IDS = ROOTS.map(r => r[0]);
    const share = {}, region = {}, via = {};   // via: for each country, the share that comes through each great-grandparent
    const count = (id, w, root) => {
      const pl = placeOf(id), g = ORIGINS[pl.split(/[,(]/)[0].trim()] || "Not traced", reg = (pl.match(/\(([^)]+)\)/) || [])[1];
      share[g] = (share[g] || 0) + w;
      if (reg) (region[g] = region[g] || {})[reg] = (region[g][reg] || 0) + w;
      if (root) (via[g] = via[g] || {})[root] = (via[g][root] || 0) + w;
    };
    const walk = (id, w, root) => {
      if (ROOT_IDS.includes(id)) root = id;
      const ps = parentsOf(id);
      ps.forEach(q => walk(q, w / 2, root));
      if (ps.length < 2) count(id, w * (2 - ps.length) / 2, root);
    };
    walk("tim", 1, null);
    const groups = Object.keys(share).sort((a, b) => (a === "Not traced") - (b === "Not traced") || share[b] - share[a]);
    // whole percentages that add up to 100: round each down, then give the points left over to the largest remainders
    const pct = {};
    groups.forEach(g => { pct[g] = Math.floor(share[g] * 100 + 1e-9); });
    const left = 100 - groups.reduce((t, g) => t + pct[g], 0);
    [...groups].sort((a, b) => (share[b] * 100 % 1) - (share[a] * 100 % 1)).slice(0, left).forEach(g => { pct[g]++; });
    const FRAC = { 0.125: "⅛", 0.25: "¼", 0.375: "⅜", 0.5: "½", 0.625: "⅝", 0.75: "¾", 0.875: "⅞" };
    const frac = f => { if (f > 0.999) return ""; if (FRAC[f]) return " " + FRAC[f];
      let d = 16; while (Math.abs(f * d - Math.round(f * d)) > 1e-9 && d < 1024) d *= 2; return ` ${Math.round(f * d)}/${d}`; };
    const root = id => { const q = byId[id], w = q.short.split(" "); return `${w[0]} ${q.nee || w[w.length - 1]}`; };
    const pc = n => n < 1 ? "under 1%" : Math.round(n) + "%";
    document.getElementById("ancRows").innerHTML = groups.map(g => {
      const through = Object.entries(via[g] || {}).sort((a, b) => b[1] - a[1] || ROOT_IDS.indexOf(a[0]) - ROOT_IDS.indexOf(b[0]))
        .map(([id, w]) => `<button type="button" class="root-btn" data-id="${id}">${esc(root(id))}</button>${frac(w * 8)}`).join(", ");
      const regs = Object.entries(region[g] || {}).map(([r, w]) => ` ${pc(w * 100)} is from ${esc(r)}.`).join("");
      return `<div class="anc-row"><div class="anc-head"><span>${esc(g)}${flagAfter(g)}</span><span class="anc-pct">${pct[g] ? pct[g] + "%" : "under 1%"}</span></div>` +
        `<div class="anc-bar" title="${esc(g)}: ${(share[g] * 100).toFixed(1)}% of your ancestry" aria-hidden="true"><i style="width:${(share[g] * 100).toFixed(2)}%"></i></div>` +
        `<p class="anc-from">${through ? through + "." : ""}${regs}</p></div>`;
    }).join("");
    if (share.Irish) document.getElementById("ancIrish").remove();

    // ---- the eight great-grandparents ----
    // Four couples, each under the grandparent they are the parents of, with a tag for the side. Each card opens the person. It shows
    // the portrait, the name, the years, the countries the line comes from (from the sum above) and where the roots lie (ROOTS).
    // A wife's surname at birth follows her name in brackets, "(née Wittber)", as part of the one title, so each card shows the surname of its line (Tim, 2026-10-27).
    const rootCard = id => {
      const p = byId[id];
      const av = p.photo && (p.photo.img || p.photo.src)
        ? `<span class="avatar has-photo" data-fallback="${esc(initials(p))}">${photoHtml(p, 56, null)}</span>`
        : `<span class="avatar">${esc(initials(p))}</span>`;
      // the line's countries, the largest part first: "Scottish 🏴", or "½ German 🇩🇪" when the line is mixed
      const from = groups.filter(g => g !== "Not traced" && via[g] && via[g][id]).sort((a, b) => via[b][id] - via[a][id])
        .map(g => `<span>${frac(via[g][id] * 8).trim()}${via[g][id] * 8 < 0.999 ? " " : ""}${esc(g)}${flagAfter(g)}</span>`).join("");
      return `<button type="button" class="root-card side-${p.side}" data-id="${id}">${av}` +
        `<span class="rc-id"><span class="rc-name">${esc(p.name)}${p.nee ? ` (née&nbsp;${esc(p.nee)})` : ""}</span><span class="rc-yrs">${esc(life(p))}</span></span>` +
        `<span class="rc-from">${from}</span><span class="rc-text">${esc(ROOTS.find(r => r[0] === id)[1])}</span></button>`;   // the countries keep their row, even empty, so the rows line up
    };
    const couples = [];
    ROOT_IDS.forEach(id => { const f = FAMILIES.find(f => (f.a === id || f.b === id) && ROOT_IDS.includes(f.a) && ROOT_IDS.includes(f.b)); if (f && !couples.includes(f)) couples.push(f); });
    document.getElementById("roots").innerHTML = couples.map(f => {
      const kid = (f.kids || []).find(k => LINE.has(k)), side = byId[f.a].side;
      return `<div class="rc-couple"><div class="rc-head"><span>${esc(root(kid))}'s parents</span><span class="rc-side side-${side}">${side === "m" ? "Mum's side" : "Dad's side"}</span></div>` +
        ROOT_IDS.filter(id => id === f.a || id === f.b).map(rootCard).join("") + `</div>`;
    }).join("");
    // The text rows are 1fr, so they match across the rows of couples. Each name block takes the height of the tallest name and years,
    // set here, so all eight cards stay one size when one long name wraps onto an extra line. A fixed row height would not do: the
    // grid's 32 px gap then shows inside each couple. It runs again when the width or a late font changes a name.
    const rootsEl = document.getElementById("roots");
    const evenNames = () => {
      const h = Math.max(...[...rootsEl.querySelectorAll(".rc-id")].map(e => [...e.children].reduce((t, c) => t + c.offsetHeight, 0)));
      if (rootsEl.style.getPropertyValue("--rc-id-h") !== h + "px") rootsEl.style.setProperty("--rc-id-h", h + "px");
    };
    if (window.ResizeObserver) { const ro = new ResizeObserver(evenNames); rootsEl.querySelectorAll(".rc-name").forEach(e => ro.observe(e)); } else evenNames();
    document.querySelectorAll("#roots .avatar.has-photo img").forEach(img => {
      img.addEventListener("error", () => { const a = img.closest(".avatar"); if (a) { a.classList.remove("has-photo"); a.textContent = a.dataset.fallback; } });
    });
  }

  // ---- reading panel ----
  // A row in a family list: one button with the portrait, the name, what they are to this person and their years,
  // and an arrow. A tap opens that person. Rows look like rows, so it is plain that they lead somewhere.
  const male = q => (!/wife/i.test(q.rel || "") && /father|uncle|brother|\bson\b|husband|nephew/i.test(q.rel || "")) || q.id === "tim";
  const female = q => /mother|aunt|sister|daughter|wife|niece/i.test(q.rel || "");
  // Tim's mark for a person on his line (his direct ancestors): the DNA he carries. It replaces the words "your line".
  const LINE_MARK = `<span class="line-mark" role="img" aria-label="your line" title="Your line">🧬</span>`;
  const onMyLine = id => LINE.has(id) && id !== "tim";
  const famItem = (k, label) => {
    const q = byId[k];
    if (!q || q.who) return "";
    const what = typeof label === "function" ? label(q) : label;
    const av = q.photo && (q.photo.img || q.photo.src)
      ? `<span class="avatar has-photo" data-fallback="${esc(initials(q))}">${photoHtml(q, 36, null)}</span>`
      : `<span class="avatar">${esc(q.many ? "+" : initials(q))}</span>`;
    const bits = [what, life(q)].filter(Boolean).join(" · ");
    const mark = onMyLine(k) ? (bits ? " · " : "") + LINE_MARK : "";
    return `<li><button type="button" class="fam-row side-${q.side}" data-id="${k}">${av}<span class="fam-txt"><b>${q.adopted ? ADOPTED : ""}${esc(q.name)}</b><small>${esc(bits)}${mark}</small></span><span class="chev" aria-hidden="true">›</span></button></li>`;
  };
  const sibWord = q => q.many ? "" : male(q) ? "Brother" : female(q) ? "Sister" : "";
  const kidWord = q => q.many ? "" : q.id === "tim" ? "You" : male(q) ? "Son" : female(q) ? "Daughter" : "";
  // the family a person was born into
  const birthOf = id => FAMILIES.find(f => (f.all || []).includes(id) || f.kids.includes(id));
  const famParents = id => {
    const f = birthOf(id);
    if (!f) return LINE.has(id) && id !== "tim" ? `<h4>Parents</h4><ul class="fam-list"><li class="fam-none">Not found yet</li></ul>` : "";
    const pa = [f.a, f.b].filter(k => k && byId[k] && !byId[k].who), dad = pa.find(k => isFather(byId[k]) || male(byId[k])), mum = pa.find(k => k !== dad);
    const rows = (dad ? famItem(dad, "Father") : `<li class="fam-none">Father not found yet</li>`)
      + (mum ? famItem(mum, "Mother") : `<li class="fam-none">Mother not found yet</li>`);
    return `<h4>Parents</h4><ul class="fam-list">${rows}</ul>`;
  };
  const famSiblings = id => {
    const f = birthOf(id);
    const sibs = f ? (f.all && f.all.length ? f.all : f.kids).filter(k => k !== id) : [];
    return sibs.length ? `<h4>Brothers and sisters · ${sibs.length}</h4><ul class="fam-list">${sibs.map(k => famItem(k, sibWord)).join("")}</ul>` : "";
  };

  // A link to an Ancestry tree opens the person's own page in it, when ANC holds their id there. Other links to the
  // same tree go. With no link to that tree, the page link is added. Tim, 2026-10-26.
  const treeOf = u => (u.match(/ancestry\.[a-z.]+\/family-tree\/(?:person\/)?tree\/(\d+)/) || [])[1];
  const ancLinks = p => {
    let out = (p.links || []).map(k => [SRC[k][0], SRC[k][1]]);
    for (const e of (ANC[p.id] || "").split(" ").filter(Boolean)) {
      const [tree, pid] = e.split("/");
      const own = [`${ANC_TREES[tree] || "Ancestry tree " + tree}: ${p.name}'s page — Ancestry`, `https://www.ancestry.com/family-tree/person/tree/${tree}/person/${pid}/facts`];
      const at = out.findIndex(([, u]) => treeOf(u) === tree);
      out = out.filter(([, u]) => treeOf(u) !== tree);
      out.splice(at < 0 ? out.length : at, 0, own);
    }
    return out;
  };

  function renderPanel(p) {
    // The portrait sits above the name, always: the photo, or the initials when there is none. The same round frame as on the cards.
    const av = p.photo && (p.photo.img || p.photo.src || p.photo.avatar)
      ? `<span class="avatar has-photo" data-fallback="${esc(initials(p))}">${photoHtml(p, 96, p.photo.avatar ? { x: p.photo.avatar.x, y: p.photo.avatar.y, w: p.photo.avatar.d } : null)}</span>`
      : `<span class="avatar">${esc(initials(p))}</span>`;
    const photo = `<div class="p-photo side-${p.side}${p.id === "tim" ? " you" : ""}">${av}${p.photo ? `<small>Photo: ${esc(p.photo.credit)}</small>` : ""}</div>`;
    const facts = p.facts.length ? `<section><h3>Records</h3><dl class="facts">${p.facts.map(f =>
      // a fact from an online family tree starts with 🗣️ (Tim, 2026-10-26; it replaced a "Not verified" pill)
      
      `<dt>${esc(f[0])}</dt><dd>${f[3] ? "🗣️\u00A0" : ""}${esc(f[1])}<small>${esc(f[2] || "")}</small></dd>`).join("")}</dl></section>` : "";
    // Photographs: the card's own portrait first, then the wider photographs. Tim asked on 2026-10-25 that the card show every photo
    // of the person, the portrait included. The portrait keeps its own size, up to 320 px, so a small one is not blown up.
    // A portrait cut from a bigger photo is never shown here: the full photo it was cut from is shown instead, once.
    // "from" on the photo names that full photo, a key of PHOTOS. Tim asked for this on 2026-10-25, twice.
    const gal = p.gallery || [], src = p.photo && p.photo.from;
    const lead = !(p.photo && p.photo.img) ? []
      : src ? (gal.some(g => g.img === src) ? [] : [{ img: src, caption: p.photo.fromCaption || "", credit: p.photo.credit || "" }])
      : [{ img: p.photo.img, caption: p.photo.caption || "", credit: p.photo.credit || "", pro: true }];
    // The full photo behind the card's portrait always comes first (Tim, 2026-11-01).
    const pics = lead.concat(gal.filter(g => g.img === src), gal.filter(g => g.img !== src));
    const gallery = pics.length ? `<section><h3>Photographs</h3><div class="gal">${pics.map(g =>
      `<figure${g.pro ? ' class="gal-pro"' : ""}><img tabindex="0" ${g.img ? `data-key="${esc(g.img)}" ` : ""}${g.img ? imgSrc(g.img) : `src="${esc(g.src)}"`} alt="${esc(g.caption || p.short)}" loading="lazy"><figcaption>${esc(g.caption)}<small>${esc(g.credit)}</small></figcaption></figure>`).join("")}</div></section>` : "";
    // Family: the father, the mother, the brothers and sisters, and the children. Each name opens that person,
    // so the reader can walk the family from inside the card. Tim asked for this on 2026-10-25.
    const fams = FAMILIES.filter(f => f.a === p.id || f.b === p.id);
    const kidsOf = fams.map(fam => {
      const other = byId[fam.a === p.id ? fam.b : fam.a];
      const title = fams.length > 1 && other ? "Children with " + other.short.split(" ")[0] : "Children";
      if (!fam.all.length) return `<h4>Marriage to ${esc(other.short.split(" ")[0])}${fam.count ? " · " + esc(fam.count) : ""}</h4>${fam.note ? `<p class="kids-note">${esc(fam.note)}</p>` : ""}`;
      const n = String(fam.count).replace(/^(\d+) (children|child)$/, "$1").replace(/^(\d+) known$/, "$1 known, perhaps more");
      return `<h4>${esc(title)} · ${esc(n)}</h4><ul class="fam-list">${fam.all.map(k => famItem(k, kidWord)).join("")}</ul>${fam.note ? `<p class="kids-note">${esc(fam.note)}</p>` : ""}`;
    }).join("");
    const kids = `<section class="fam"><h3>Family</h3>${famParents(p.id)}${famSiblings(p.id)}${kidsOf}</section>`;
    const pl = PLACES[p.id] && PLACES[p.id].rows.length ? `<section><h3>Places</h3><dl class="facts">${PLACES[p.id].rows.map(r =>
      `<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`).join("")}</dl></section>` : "";
    const linkList = ancLinks(p);
    const links = linkList.length ? `<section><h3>Links</h3><ul class="linklist">${linkList.map(([label, url]) =>
      `<li><a href="${esc(url)}" target="_blank" rel="noopener">${/ancestry\./.test(url) ? "🌿\u00A0" : ""}${esc(label)}</a></li>`).join("")}</ul></section>` : "";
    panelInner.innerHTML = `
      <div class="p-head">${photo}<div>
        <h2>${p.adopted ? ADOPTED : ""}${esc(p.name)}${onMyLine(p.id) ? "&nbsp;" + LINE_MARK : ""}</h2>
        ${p.nee ? `<div class="nee">née ${esc(p.nee)}. Her surname at birth was ${esc(p.nee)}.</div>` : ""}
        <div class="yrs">${esc(life(p))}</div>
        ${place(p) ? `<div class="p-badges"><span class="badge">${esc(place(p))}</span></div>` : ""}
        ${p.notable ? `<p class="p-notable">${STAR}${esc(p.notable)}</p>` : ""}${recordOf(p.id).map(r => `<p class="p-notable">${r.mark}${esc(r.text)}</p>`).join("")}${p.war ? `<p class="p-notable">${warMark(p)}${esc(p.war.text)}</p>` : ""}${p.likely ? `<p class="p-notable"><span>${LIKELY}Likely, not proven. ${esc(p.likelyWhy || "")}</span></p>` : ""}${p.hearsay ? `<p class="p-notable"><span>${HEARSAY}Hearsay: we checked, and only other people's family trees back these facts. No record does.</span></p>` : toCheck(p) ? `<p class="p-notable"><span>${TOCHECK}To be checked: this person comes from someone else's family tree on Geni. No record of the time has confirmed them yet.</span></p>` : ""}
      </div></div>
      <div class="relbox side-${p.side}">
        <div class="big">${p.id === "tim" ? "You" : `Your <span class="rw">${esc(p.rel.toLowerCase())}</span>`}</div>
        <div class="plain">${esc(p.plain)}</div>
        ${p.chain ? `<div class="chain">${esc(p.chain)}</div>` : ""}
      </div>
      ${kids}
      <section class="bio">${bioHtml(p.bio)}</section>
      ${pl}${gallery}${facts}${links}`;
    panelInner.querySelectorAll(".gal img").forEach(img => img.addEventListener("error", () => img.closest("figure").remove()));
    panelInner.querySelectorAll(".fam-row .avatar.has-photo img").forEach(img => img.addEventListener("error", () => { const a = img.closest(".avatar"); if (a) { a.classList.remove("has-photo"); a.textContent = a.dataset.fallback; } }));
    panelInner.querySelectorAll(".p-photo .avatar.has-photo img").forEach(img => img.addEventListener("error", () => { const a = img.closest(".avatar"); if (a) { a.classList.remove("has-photo"); a.textContent = a.dataset.fallback; } }));
  }

  // The panel for a box: all the brothers and sisters of one ancestor, in one place.
  function renderBoxPanel(c) {
    const kids = c.members.map(k => byId[k]);
    const fam = FAMILIES.find(f => (f.clusters || []).includes(c.id));
    const anc = fam ? byId[fam.kids.find(k => LINE.has(k)) || fam.kids[0]] : null;   // the ancestor they grew up with
    const count = kids.reduce((t, k) => t + (k.many || 1), 0);
    const aunts = /aunt/i.test(c.rel), uncles = /uncle/i.test(c.rel);
    const words = aunts && uncles ? (count === 2 ? "brother and sister" : "brothers and sisters") : aunts ? (count === 1 ? "sister" : "sisters") : (count === 1 ? "brother" : "brothers");
    const segs = kids[0].chain ? kids[0].chain.split(" → ") : [];
    const chain = !segs.length ? "" : count === 1 ? kids[0].chain : ["They", "their " + segs[1].replace(/^(his|her|their) /, "")].concat(segs.slice(2)).join(" → ");
    const links = [...new Set(kids.flatMap(k => k.links))];
    const oneSib = k => {
        // each fact with its own source, as in Records; only a fact from an online family tree starts with 🗣️ (Tim, 2026-10-26)
        const facts = k.mini && k.facts.length ? `<dl class="facts">${k.facts.map(f =>
          `<dt>${esc(f[0])}</dt><dd>${f[3] ? "🗣️\u00A0" : ""}${esc(f[1])}<small>${esc(f[2] || "")}</small></dd>`).join("")}</dl>` : "";
        // The ancestor takes 🧬 and one line; a child who died young keeps their place, in grey (Tim, 2026-11-12).
        const isAnc = anc && k.id === anc.id, dy = k.young || k.many;
        const text = isAnc ? `<p>Your ${esc((k.rel || "").toLowerCase())}. Their own card has the full story.</p>` : k.mini ? bioHtml(k.bio) : `<p>${esc(k.plain || "")} Their own card has the full story.</p>`;
        return `<section class="sib${dy ? " dy" : ""}"><h4><button type="button" class="sib-open" data-id="${k.id}">${k.adopted ? ADOPTED : ""}${esc(k.name)}${isAnc ? "\u00A0🧬" : ""} ›</button></h4><div class="when">${esc(k.years || "")}${dy ? " · died young" : ""}</div>${text}${isAnc ? "" : facts}</section>`;
    };
    // The panel matches the box: "All children", the ancestor among them, all in birth order (Tim, 2026-11-12).
    const all = kids.concat(anc && !kids.includes(anc) ? [anc] : []).sort((a, b) => bornIn(a) - bornIn(b));
    const total = all.reduce((t, k) => t + (k.many || 1), 0);
    const parents = fam ? [fam.a, fam.b].filter(k => byId[k]).map(k => byId[k].short).join(" and ") : "";
    panelInner.innerHTML = `
      <div class="p-head"><div>
        <h2>All children</h2>
        <div class="yrs">${total} ${total === 1 ? "child" : "children"}${parents ? ` of ${esc(parents)}` : ""}</div>
      </div></div>
      <div class="relbox side-${kids[0].side}">
        <div class="big">Your <span class="rw">${esc(c.rel.toLowerCase())}</span></div>
        <div class="plain">${esc(c.plain || (anc ? `The ${words} of ${anc.name}.` : ""))}</div>
        ${chain ? `<div class="chain">${esc(chain)}</div>` : ""}
      </div>
      ${anc ? `<section class="fam"><h3>Family</h3>${famParents(anc.id)}<h4>On your line</h4><ul class="fam-list">${famItem(anc.id, sibWord)}</ul></section>` : ""}
      <div class="sibs">${all.map(oneSib).join("")}</div>
      ${links.length ? `<section><h3>Links</h3><ul class="linklist">${links.map(k => `<li><a href="${esc(SRC[k][1])}" target="_blank" rel="noopener">${/ancestry\./.test(SRC[k][1]) ? "🌿\u00A0" : ""}${esc(SRC[k][0])}</a></li>`).join("")}</ul></section>` : ""}`;
  }

  let current = "tim";
  // Pick a person or a box. A direct ancestor lights the line from that person down to Tim.
  // A box of brothers and sisters, or another relative, only opens the panel. The choice takes a mark while the panel is open.
  function select(id, opts = {}) {
    // Everyone opens their own card, also a brother or sister in a box (Tim, 2026-10-26). The box itself opens the family.
    const box = clById[id], p = box ? null : byId[id];
    if (!box && !p) return;
    if ((box || p).early && !early && window.setEarly) { current = id; window.setEarly(true); return select(id, opts); }
    current = id;
    const direct = !!p && LINE.has(id) && id !== "tim";
    canvas.querySelectorAll(".card").forEach(c => {
      c.classList.toggle("sel", c.dataset.id === id);
      c.classList.toggle("on-path", direct && p.path.includes(c.dataset.id));
    });
    canvas.querySelectorAll(".cluster").forEach(c => { c.classList.remove("on-path"); c.classList.toggle("sel", c.dataset.cluster === id); });
    // A name in a box: the full mark when the box is their only place on the tree, a light one when they also have a card.
    canvas.querySelectorAll(".cluster .bn").forEach(n => {
      n.classList.toggle("pick", !!p && n.dataset.id === id && !!p.mini);
      n.classList.toggle("also", !!p && n.dataset.id === id && !p.mini);
    });
    canvas.classList.toggle("has-sel", direct);
    const at = box || p;
    if (box) renderBoxPanel(box); else     renderPanel(p);
    panel.scrollTop = 0;
    if (opts.open) {
      setPanel(true);
      // keep the chosen card clear of the panel
      const el = canvas.querySelector(`.card[data-id="${id}"], .cluster[data-cluster="${id}"]`);
      if (el && !opts.reveal && getComputedStyle(panel).position === "fixed" && !APP.matches) {
        const free = window.innerWidth - panel.offsetWidth - 16, r = el.getBoundingClientRect();
        if (r.right > free) treeScroll.scrollBy({ left: r.right - free, behavior: "smooth" });
      }
    }
    if (opts.reveal) {
      // Opened from outside the chart, the chart goes to 100% and the person sits in the middle of the part you can see:
      // left of the panel when it slides over the chart. A click on a card in the chart keeps the zoom. Tim, 2026-11-06.
      setZoom(1, true);
      // Where the person is on the chart, before zoom: their card, or their box when they have no card.
      let spot = canvas.querySelector(`.card[data-id="${id}"], .cluster[data-cluster="${id}"]`);
      if (!spot) { const bn = canvas.querySelector(`.bn[data-id="${id}"]`); spot = bn && bn.closest(".cluster"); }
      const cx = spot && spot.offsetParent ? spot.offsetLeft + spot.offsetWidth / 2 : X(at.col) + CARD_W / 2;
      const cy = spot && spot.offsetParent ? spot.offsetTop + spot.offsetHeight / 2 : Y(at.row) + CARD_H / 2;
      const boxLeft = treeScroll.getBoundingClientRect().left + treeScroll.clientLeft;
      const over = getComputedStyle(panel).position === "fixed" && !APP.matches;
      const seen = over ? Math.max(200, Math.min(treeScroll.clientWidth, document.documentElement.clientWidth - panel.offsetWidth - boxLeft)) : treeScroll.clientWidth;
      const left = EDGE + cx * zoom - seen / 2;
      const top = edgeTop() + cy * zoom - treeScroll.clientHeight / 2;
      if (Number.isFinite(left) && Number.isFinite(top)) treeScroll.scrollTo({ left: Math.max(0, left), top: Math.max(0, top), behavior: "smooth" });
      // The page glides up to the tree with its bar of buttons ("All children", "Direct line only", "Missing ancestors")

      document.addEventListener("webkitfullscreenchange", show);

  const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const toHex = b => Array.from(b, x => x.toString(16).padStart(2, "0")).join("");
  const fromHex = h => Uint8Array.from(h.match(/../g) || [], x => parseInt(x, 16));
  const utf8 = s => new TextEncoder().encode(s);
  const salt = fromB64(V.salt), nonce = fromB64(V.nonce), tag = fromB64(V.tag), ct = fromB64(V.ct);
  const STORE = "family-tree-key-v1";
  const lock = document.getElementById("lock"), app = document.getElementById("app");
  const form = document.getElementById("lockForm"), input = document.getElementById("lockPw");
  const btn = document.getElementById("lockBtn"), msg = document.getElementById("lockMsg");

  // The browser's own crypto makes the key fast. Without it, the plain code above does the same work.
  async function makeKey(password) {
    const pw = utf8(cleanPassword(password));
    try {
      if (window.crypto && crypto.subtle) {
        const k = await crypto.subtle.importKey("raw", pw, "PBKDF2", false, ["deriveBits"]);
        return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", salt, iterations: V.iter, hash: "SHA-256" }, k, 256));
      }
    } catch (e) {}
    return pbkdf2(pw, salt, V.iter);
  }
  function open(master) {
    const all = new Uint8Array(salt.length + nonce.length + ct.length);
    all.set(salt); all.set(nonce, salt.length); all.set(ct, salt.length + nonce.length);
    const t = hmac(hmac(master, utf8("mac")), all);
    let diff = 0;
    for (let i = 0; i < 32; i++) diff |= t[i] ^ tag[i];
    if (diff) return false;
    const D = JSON.parse(new TextDecoder().decode(xorStream(hmac(master, utf8("enc")), nonce, ct)));
    // A photo is its own locked file in p/. The page asks for one when it shows it: fetch, check, unlock, show.
    const phKey = hmac(master, utf8("photo")), phMac = hmac(master, utf8("photo-mac"));
    window.openPhoto = file => fetch(file).then(r => { if (!r.ok) throw new Error("photo " + r.status); return r.arrayBuffer(); }).then(buf => {
      const b = new Uint8Array(buf), pn = b.subarray(0, 16), pt = b.subarray(16, 48), pc = b.subarray(48);
      const all = new Uint8Array(16 + pc.length); all.set(pn); all.set(pc, 16);
      const t = hmac(phMac, all);
      let d = 0;
      for (let i = 0; i < 32; i++) d |= t[i] ^ pt[i];
      if (d) throw new Error("photo check failed");
      return URL.createObjectURL(new Blob([xorStream(phKey, pn, pc)], { type: "image/jpeg" }));
    });
    app.innerHTML = D.html;
    app.hidden = false;
    lock.remove();
    startApp(D.data);
    return true;
  }
  try { const saved = localStorage.getItem(STORE); if (saved && open(fromHex(saved))) return; } catch (e) {}
  lock.hidden = false;
  input.focus();
  form.addEventListener("submit", async e => {
    e.preventDefault();
    if (!input.value) return;
    btn.disabled = true;
    msg.textContent = "Opening. This can take a few seconds.";
    await new Promise(r => setTimeout(r, 40));
    let ok = false, master = null;
    try { master = await makeKey(input.value); ok = open(master); } catch (err) { ok = false; }
    if (ok) { try { localStorage.setItem(STORE, toHex(master)); } catch (err) {} return; }
    msg.textContent = "That password is not right. Try again.";
    btn.disabled = false;
    input.select();
  });
})();
